# Every string the bot uses. Edit freely to restyle messages.
# Placeholders in {braces} are filled in by the bot.
# Discord markdown works in chat messages: **bold**, *italic*, `code`, emoji, etc.

console:
  logged_in: "Logged in as {tag}. Jobs: {jobs}"
  invite: "Invite: {url}"
  missing_token: "DISCORD_TOKEN is missing. Put it in {path}"
  job_failed: "Job {type} ({id}) failed: {error}"

timer:
  command: "set-timer"
  description: "Start a countdown timer"
  option: "seconds"
  option_description: "Time in seconds"
  started: "Timer set for {seconds} seconds."
  done: "{username}, your timer is up."
