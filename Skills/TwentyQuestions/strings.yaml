# Strings for the TwentyQuestions skill. Edit freely to restyle messages.
# Placeholders in {braces} are filled in by the bot.

command: "20questions"
description: "Start a game of 20 Questions for everyone to play together"
category_option: "category"
category_description: "What it should be about, in your own words (like \"80s movies\" or \"animals\")"

# Without a category, a game picks one of these at random. Each must be a tag from good_articles.json.
categories:
  - Films
  - Albums & songs
  - Musicians & singers
  - Fictional characters
  - Actors & entertainers
  - TV episodes & seasons
  - Sci-Fi
  - Buildings & structures
  - Books & novels
  - Fantasy
  - Food & drink
  - TV shows
  - Great Works
  - Animation
  - Cities & towns
  - Computers & internet
  - Trains & public transport
  - Politicians & leaders
  - Comics & superheroes
  - Writers & poets

# --- Starting a game ---

picking: "🤔 Thinking of something…"
started: "🎯 **{username}** started a game of **20 Questions** about **{category}**! Join in below."
thread_name: "20 Questions: {category}"
already_running: "There's already a game going on this server: {link}\nJoin in, or wait until it's over."
not_here: "Start a game in a regular channel, not in a thread."
start_failed: "Sorry, I couldn't start a game just now. Please try again in a minute."
start_cancelled: "🛑 Game cancelled."
category_none: "I couldn't find anything for **{category}**. Try something broader, or leave the category out for a random one."
category_used_up: "That's every topic I had for **{category}**! Use /20questions to start a new game."
thread_closed: "This game has finished. Use /20questions to start a new one."

# The first message in a new thread, ending with the intro to the fun facts (shown in a box below it).
rules: |
  I'm thinking of something from **{category}**. Can you work out what it is?

  - Ask me yes-or-no questions. You have {questions}.
  - Stuck? Ask for a hint, but each one uses up a question.
  - Think you know? Make a guess, or ask me for four options to vote on.
  - Earn awards along the way for great (and not so great) questions.
  - Time runs out <t:{ends}:R>. Say "stop the game" to end it early.

  {intro}
intro: "Here are three fun facts to get you started:"
intro_again: "Here's another one from **{category}**! Three fun facts to get you started:" # Play again
fact: "• {fact}"

# --- Playing ---

# Replies to questions. A right guess gets the win message instead.
answers:
  yes: "✔️ Yes!"
  no: "❌ No."
  sort_of: "🌀 Sort of."
not_yes_no: "🤔 I can only answer yes or no. Try asking it another way!" # doesn't use up a question
questions_left: "({left} questions left)" # added to an answer or a hint at 15, 10 and 5 questions left
hint: "💡 {hint}"

# Awards, shown in a box under the answer that earned them. Players collect them for good: each one is only shown
# the first time a player earns it.
award: "**{username}** earned **{name}** ({count}/{total})\n-# {about}\n\n-# {others}" # count: how many they've collected
award_others: "{names} have this, too." # other players with this award
award_others_one: "{names} has this, too."
award_first: "Nobody else has this one yet!"
list_and: " and "
list_others: "{count} others" # "Ana, Ben, Cat and 2 others"

# The My awards button at the end of a game: the player's collection, only visible to them. A box for every award,
# earned or still locked.
my_awards: "🏅 My awards"
collection_title: "🏅 **Awards earned:** {count} of {total}"
collection_earned: "**{name}**{new}\n-# {about}"
collection_new: " · ✨ New!" # earned in the game that just ended
collection_locked: "**🔒 Locked**\n{lines}" # one box for all locked awards
collection_locked_line: "-# {about}" # one line per locked award: how to earn it
awards:
  hot_stuff:
    name: "🔥 Hot Stuff"
    about: "Make a guess or ask a question very close to the answer."
  breakthrough:
    name: "💥 Breakthrough"
    about: "Ask a question that narrows it down a lot."
  trailblazer:
    name: "🧭 Trailblazer"
    about: "Ask four questions in a row that get a yes."
  first_try:
    name: "🎯 First Try"
    about: "Guess the answer with your very first question."
  scenic_route:
    name: "🏞️ Scenic Route"
    about: "Ask a wildly unrelated question, 10 or more questions in."
  sleep_on_it:
    name: "😴 Sleep on It"
    about: "Take a good long think before asking the question."
  take_a_hint:
    name: "🙈 Take a Hint"
    about: "Ask four questions in a row that get a no. Maybe it's time for a hint?"
  lead_not_read:
    name: "⚡ I'm Here to Lead, Not to Read"
    about: "Ask a question within 2 seconds of a new game starting."
  final_boss:
    name: "👑 Final Boss"
    about: "Ask your first question in the second half of the game, and get a yes."
  ice_breaker:
    name: "🧊 Ice Breaker"
    about: "Ask the first question of the round."
  comeback_kid:
    name: "🔄 Comeback Kid"
    about: "Get a yes right after the team got two noes in a row."
  eleventh_hour:
    name: "🕚 The 11th Hour"
    about: "Find the answer with under a minute left, or with the very last question."
  team_player:
    name: "🤝 Team Player"
    about: "Ask a question that builds on a yes someone else got."
  # Winning
  winner:
    name: "🏆 Winner"
    about: "Make the winning guess."
  sharpshooter:
    name: "🎯 Sharpshooter"
    about: "Make the winning guess with 5 questions or fewer used."
  no_help_needed:
    name: "🧭 No Help Needed"
    about: "Make the winning guess in a game where nobody asked for a hint."
  hat_trick:
    name: "🎩 Hat Trick"
    about: "Make the winning guess in 3 different games."
  # Coming back
  welcome_aboard:
    name: "🐣 Welcome Aboard"
    about: "Ask your very first question."
  regular:
    name: "📚 Regular"
    about: "Take part in 10 games."
  explorer:
    name: "🗺️ Explorer"
    about: "Take part in games from 5 different categories."
  centurion:
    name: "💯 Centurion"
    about: "Ask 100 questions in total."
  # Polls and the team
  wisdom_of_the_crowd:
    name: "🧠 Wisdom of the Crowd"
    about: "Vote for the right answer in a poll."
  swing_vote:
    name: "🗳️ Swing Vote"
    about: "Cast the vote that decides a poll."
  fence_sitter:
    name: "🌀 Fence Sitter"
    about: "Get three \"sort of\" answers in one game."
  full_house:
    name: "🎉 Full House"
    about: "Take part in a game with 4 or more players."
  # Taking part in a game whose topic has one of these tags (from good_articles.json)
  film_buff:
    name: "🎬 Film Buff"
    about: "Take part in a game about a film."
    tags: [Films]
  mixtape:
    name: "🎵 Mixtape"
    about: "Take part in a game about music or a musician."
    tags: [Albums & songs, Musicians & singers, Music]
  cyberpunk:
    name: "🤖 Cyberpunk"
    about: "Take part in a game about science fiction."
    tags: [Sci-Fi]
  spellbound:
    name: "🐉 Spellbound"
    about: "Take part in a game about fantasy."
    tags: [Fantasy]
  book_club:
    name: "📖 Book Club"
    about: "Take part in a game about a book or a great work."
    tags: [Books & novels, Great Works]
  poet_society:
    name: "✒️ Poet Society"
