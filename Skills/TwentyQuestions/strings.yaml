  # Last, as it needs all the others
  completionist:
    name: "👑 Completionist"
    about: "Collect every other award."

# When nobody has asked anything for a while: what the players know so far, and some questions to try.
nudge: |
  🧠 **Here's what we know so far:** {recap}
  Not sure what to ask? Try one of these:
  {questions}
nudge_question: "• {question}"

# Headings the info card picks 3 from (plus 1 of its own for the topic).
infocard_headings:
  - Why It Matters
  - Behind the Scenes
  - Fun Fact
  - Origin Story
  - By the Numbers
  - Common Misconception
  - Legacy
  - In Pop Culture
  - Record Breaker
  - Then and Now
  - Hidden Detail
  - What's in a Name
  - Who's Behind It
  - Around the World
  - In Their Own Words
  - What Came Next
  - Odd Connection
  - Close Relatives
  - Bumps in the Road
  - Try It Yourself
time_left: "⏳ Time runs out <t:{ends}:R>."
answer_failed: "Sorry, I couldn't answer that just now. Please try again."

# Four options to vote on: when asked for, or after the last question. The most votes is the final answer.
out_of_questions: "That was your last question! Now you'll have to pick the answer. Get ready…"
options_closes: "🗳️ Time to vote! The poll closes <t:{ends}:R>, and the most votes wins."
options_question: "Which one is it?"
options_or: " or " # joins tied options

# --- Ending ---

win: "🎉 **{username}** got it, with {used} of {max} questions!"
options_win: "🎉 You picked **{picked}**. That's right!"
options_lose: "💥 You picked **{picked}**, but that's not it." # a tie shows "A or B"
options_no_votes: "💥 Nobody voted, so that's the end of this round."
timeout: "⏰ Time's up!"
stopped: "🛑 Game stopped."

# The answer with an info card, then the button to play again.
card_loading: "Let's see what it was…"
card_loading_won: "Here's more about it…" # when the players found the answer
reveal: "# {title}"
read_more: "Read more"
# YouTube videos (when YOUTUBE_API_KEY is set): trailers and songs go in the info card; a documentary comes after it.
video:
  trailer: "🎬 Watch the trailer: [{title}]({url})"
  song: "🎵 Listen on YouTube: [{title}]({url})"
  documentary: "📺 Want to know more? Watch [{title}]({url})"
play_again_prompt: "Up for another round? If not, this thread closes <t:{closes}:R>."
play_again: "Play again"
play_again_starting: "🎲 **{username}** wants another round! Thinking of something…"

# --- Instructions for the AI. Kept short: the models know what 20 Questions is. ---
prompts:
  # A category: first the tags to search (unless it's a tag itself), then the topics that fit, then each topic picked.
  categories: |
    Players of 20 Questions asked for a category in their own words. Our topics are tagged with the categories
    below. Pick the few categories (usually 1 to 3) where most topics fitting the request will be; the topics are
    checked one by one afterwards. For "80s movies": Films. For "animals": Animals. For "London": Neighbourhoods &
    streets, Buildings & structures, Monuments & landmarks. Pick none if nothing could fit.
  categories_input: |
    The players asked for: "{category}"
    Categories:
    {tags}
  shortlist: |
    Players of 20 Questions asked for this category: "{category}"
    From the Wikipedia topics below, list every topic that fits the category and makes a good secret answer,
    copying each name exactly:
    - it clearly fits what the players asked for (for "animals", a famous animal character fits too);
    - suitable: no unsavoury content, except what would be taught in K-12 school, shown in a museum or fine in a
      PG-13 film;
    - guessable: something taught at school, from pop culture, science or history, or encountered in day-to-day
      life. Not simply one of the 5,000 most common English words (like "Dog" or "Water").
  fits: |
    Players of 20 Questions asked for this category: "{category}"
    Would the article above, as the secret answer, clearly fit what they asked for? Be strict: for "80s movies", a
    film from 1990 doesn't fit. A famous fictional animal fits "animals".
  opening: |
    The article above is the secret answer in a game of 20 Questions.
    - facts: exactly 3 fun facts from the article to help the players along. Each is one short sentence (under 25
      words), surprising or delightful rather than dry, and from a different part of the article. Start broad and
      get a little more specific. Call it "it", "this person" or similar: never use the answer's name or any part
      or form of it, and don't give it away outright.
    - answers: 10 to 20 short guesses that should win because they mean exactly the same thing: names, alternative
      names, abbreviations, close synonyms, singular and plural. Never broader categories, related things or parts
      (for Frog: not "amphibian", "toad" or "tadpole").
  route: |
    Sort the newest message from a Discord game of 20 Questions:
    - ask: a question or a guess about the secret answer
    - hint: asks for a hint
    - options: asks to be given options, choices or a multiple choice to pick the answer from
    - stop: asks to stop or end the game
    - chat: anything else
    Use what just happened to understand short follow-ups: right after a hint, "another one" or "I need another"
    asks for a hint.
  route_input: |
    What just happened:
    {recent}
    Newest message: "{message}"
  # Lines about what just happened, for routing.
  recent:
    ask: '{username} asked "{text}" and got "{result}"'
    hint: '{username} asked "{text}" and got a hint'
    chat: '{username} said "{text}"'
  # The game so far, given to Sonnet when judging, writing hints and writing options.
  game: |
    This is a game of 20 Questions with yes-or-no answers.
    Secret answer: {title}
    Winning answers (a guideline, not a complete list): {answers}
    From its Wikipedia article:
    {facts}
    Questions so far:
    {log}
    Hints so far (the first three are the fun facts shown at the start):
    {hints}
  # Judging a question, and the awards it earns, in one call.
  judge: |
    The player has asked a question or made a guess: "{question}"
    result, the answer:
    - win: the guess names the secret answer in substance (ignore singular/plural and grammar mistakes; synonyms count)
    - yes: the answer to the question is yes
    - no: the answer to the question is no
    - sort_of: it could be yes or no depending on the context
    - not_yes_no: it's a question that can't be answered with yes or no (like "What colour is it?")
    Pay close attention to how the question is phrased. A question that doesn't fit the secret answer is "no": if the
    answer is Car, "Is it a Chinese car manufacturer?" is "no", because a car isn't a car manufacturer.

    Then the awards it earns. Be strict: they're rare and should feel special.
    - hot_stuff: it's very close to the secret answer without quite being it (for Frog: guessing "Toad", or asking
      "Is it a kind of amphibian that croaks?").
    - breakthrough: it narrows things down a lot compared to what the players knew before.
    - team_player: it builds directly on an earlier question that got a "yes" (after "Is it an animal?" got a yes,
      "Does it live in water?").
    {scenic}
  judge_scenic: "- scenic_route: it's wildly unrelated to the secret answer and to everything learned so far."
  hint: |
    Write one hint for the players: a short, simple, factual sentence that helps from what they've asked so far.
    Not a riddle. Don't name the secret answer or repeat earlier hints.
  # When nobody has asked anything for a while.
  recap: |
    The players have gone quiet, probably stuck. Help them get going again:
    - recap: what they know so far, in one or two short, plain sentences, from the answers and hints above (like
      "It's alive, lives near water, and isn't a mammal."). If they haven't asked anything yet, sum up the fun facts.
      Only what they've learned; never more, and never the answer.
    - questions: exactly 3 good yes-or-no questions they could ask next, each one short. Make them useful for
      narrowing things down from what they know, and easy to ask without special knowledge.
  options: |
    The players will now pick the secret answer from four options in a poll.
    - answer: the secret answer's common name, at most 50 characters.
    - decoys: exactly 3 wrong answers of the same kind, at most 50 characters each, that also fit what the players
      have learned so far, so the choice isn't obvious.
  wrap_up: |
    A game of 20 Questions about the article above has ended ({outcome}). The game log is below.
    - infocard: a museum-style info card in Discord markdown: one sentence saying what it is, then 4 short
      sections, each with a "## " heading and one or two sentences. Take 3 headings from this list, whichever
      suit the topic best, and make up 1 heading that's unique to this topic (like "The Soundtrack" for a film,
      "How to Eat It" for a dish, or "Party Trick" for an animal). Don't repeat the title.
      {headings}
    - video: for a film or theatre play, kind "trailer" and a YouTube search for its official trailer; for a song,
      kind "song" and a search for the song; otherwise, if a documentary about it likely exists on YouTube, kind
      "documentary" and a search for one; else kind "none" and search "".
