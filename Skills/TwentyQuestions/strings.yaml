# Strings for the TwentyQuestions skill. Edit freely to restyle messages.
# Placeholders in {braces} are filled in by the bot.

command: "20questions"
description: "Start a co-op game of 20 Questions"
stop_command: "20questions-stop"
stop_description: "Stop the 20 Questions game in this channel"

already_running: "A game is already running on this server: {link}\nPlease wait until it's over."
not_here: "Start the game in a normal text channel, not in a thread."
picking: "🤔 Thinking of something…"
# Added once a GIF is found. A masked link hides the URL while Discord still plays the GIF.
picking_with_gif: "{picking} [.]({url})"
gif_query: "thinking" # GIPHY search for the GIF shown while the game is being set up
gif_credit: "Gifs in this game are powered by GIPHY."
start_failed: "Sorry, I couldn't start a game right now. Please try again in a minute."
started: "🎯 **{username}** started a game of **20 Questions**! Join the thread below."
thread_name: "20 Questions: {topic}"
no_game: "There's no 20 Questions game running in this channel."
stop_not_allowed: "Only the player who started the game or someone with Manage Server can stop it."
stop_done: "Game stopped."

# How the topic was picked, shown only to the player who started the game. Never names the answer.
report:
  title: "🔍 **How I picked this one**"
  first_try: "The first idea I checked was a good one, so I went with it."
  difficulty_one: "I thought about {list}, but it wasn't the right difficulty."
  difficulty_many: "I thought about {list}, but they weren't the right difficulty."
  unsuitable_one: "One more idea wasn't family-friendly."
  unsuitable_many: "{count} more ideas weren't family-friendly."
  picked: "Then I found the one we're playing with now."
  photo: "I found an Unsplash photo for it."
  no_photo: "I couldn't find an Unsplash photo this time."
  work: "It took {wikipedia} Wikipedia lookups, {fast} Haiku-class and {accurate} Sonnet-class AI calls, and {seconds} seconds."

# The opening: the rules, then a card with the starting hint (a haiku) and an optional photo, then the credits.
# The topic only appears in the thread name.
rules: |
  I'm a person, thing, event or an idea. Guess who I am!

  Ask me questions and I'll answer **yes** {yes}, **no** {no}, or **sort of** {sort_of}. When you're ready, make a guess, or ask for a hint if you're stuck. You only have {questions} questions, but hints are free.

  The game ends <t:{ends}:R> or whenever you say "stop the game".

  Ready to go?
hint_title: "Here's a Haiku to get you on your way..."
who_am_i: "Who am I?" # added under the haiku
photo_credit: "Photo by [{name}]({profile}) on [Unsplash]({home})."
credits: "-# {credits}" # small line under the starting hint

# Answers are reactions on the player's message. A win also gets the win message.
reactions:
  win: "✔️"
  yes: "✔️"
  no: "❌"
  sort_of: "🌀"
questions_left: "{left} questions left."
time_left: "⏳ This round ends <t:{ends}:R>."
last_question: "⚠️ That was the last question! The **next guess is final**, so talk it over first."
hint: "{hint}"

win: "🎉 **{username}** got it! You found the answer with {used} of {max} questions."
lose: "💥 That was your final guess. Better luck next time!"
timeout: "⏰ Time's up!"
stopped: "🛑 Game stopped."

# End-of-game card and stats
card_loading: "Pulling up the info card…"
reveal: "# {title}"
read_more: "Read more"
stats_title: "**Game stats**"
stat_most_questions: "🙋 Most questions asked: **{username}** ({count})"
stat_valuable: "💎 Most valuable question: **{username}**: {text}"
stat_closest: "🎯 Closest guess: **{username}**: {text}"
stat_farthest: "🛰️ Farthest guess: **{username}**: {text}"
stat_related: "🔗 Weirdly related guess: **{username}**: {text}"

# Instructions for the AI. Kept short: the models know what 20 Questions is.
prompts:
  screen: |
    We're choosing the secret answer for a game of 20 Questions. Judge the Wikipedia article above.
    - suitable: no unsavoury content, except what would be taught in K-12 school, shown in a museum or fine in a PG-13 film.
    - guessable: a young adult could guess it in 20 questions from general education and knowledge, but a 13-year-old couldn't.
  setup: |
    The article above is the secret answer in a game of 20 Questions.
    - topic: its broad theme in 1 to 4 words, without giving it away (for a World War 1 tank: "World War 1").
    - searches: three general stock photo searches for that theme, most fitting first (for a World War 1 tank:
      "World War 1", "history", "soldiers"). Never the answer itself.
  opening: |
    The article above is the secret answer in a game of 20 Questions.
    - poem: a haiku of three lines, spoken by the subject itself in the first person (a designer speaks as the
      designer, not as a dress). Hint at it without naming it. Just the three lines.
    - answers: 10 to 20 short guesses that should win because they mean exactly the same thing: names, alternative
      names, abbreviations, close synonyms, singular and plural. Never broader categories, related things or parts
      (for Frog: not "amphibian", "toad" or "tadpole").
  route: |
    Sort this message from a Discord game of 20 Questions:
    - ask: a question or a guess about the secret answer
    - hint: asks for a hint
    - stop: asks to stop or end the game
    - chat: anything else
  quotes: |
    Quote up to 5 short passages from the article above, word for word, that help with this. Return none if nothing
    is relevant.
  # The game so far, given to Sonnet when judging a question and when writing a hint.
  game: |
    This is a game of 20 Questions with yes-or-no answers.
    Secret answer: {title}
    Winning answers (a guideline, not a complete list): {answers}
    Facts from Wikipedia:
    {quotes}
    Questions so far:
    {log}
    Hints so far:
    {hints}
  judge: |
    The player has asked a question or made a guess: "{question}"
    Reply with one word:
    - win: the guess names the secret answer in substance (ignore singular/plural and grammar mistakes; synonyms count)
    - yes: the answer to the question is yes
    - no: the answer to the question is no
    - sort_of: it could be yes or no depending on the context
    Pay close attention to how the question is phrased. A question that doesn't fit the secret answer is "no": if the
    answer is Car, "Is it a Chinese car manufacturer?" is "no", because a car isn't a car manufacturer.
  hint: |
    Write one hint for the players: a short, simple, factual sentence that helps from what they've asked so far.
    Not a riddle. Don't name the secret answer or repeat earlier hints.
  hint_need: "A new, simple fact for players who have asked: {asked}"
  wrap_up: |
    A game of 20 Questions about the article above has ended ({outcome}). The game log is below.
    - infocard: a museum-style info card in Discord markdown: one sentence saying what it is, then 3 or 4 short
      sections, each with a "## " heading (like "## Why it matters" or "## Fun fact") and one or two sentences.
      Don't repeat the title.
    - most_valuable_question, closest_guess, farthest_guess, related_guess (a wrong guess unusually related to the
      answer, like an actor when the answer is their film): pick from the log, or "" for both fields if none fits.
