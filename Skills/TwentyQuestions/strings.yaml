# Strings for the TwentyQuestions skill. Edit freely to restyle messages.
# Placeholders in {braces} are filled in by the bot.

command: "20questions"
description: "Start a co-op game of 20 Questions"
stop_command: "20questions-stop"
stop_description: "Stop the 20 Questions game in this channel"

already_running: "A game is already running on this server: {link}\nPlease wait until it's over."
not_here: "Start the game in a normal text channel, not in a thread."
picking: "🤔 Thinking of something…"
# GIPHY searches. GIPHY asks apps to credit it wherever its GIFs are shown.
gif_queries:
  thinking: "thinking" # while the game is being set up
  so_close: "so close" # on a close answer, at most every few minutes
gif_credit: "Powered by GIPHY"
start_failed: "Sorry, I couldn't start a game right now. Please try again in a minute."
started: "🎯 **{username}** started a game of **20 Questions**! Join the thread below."
thread_name: "20 Questions: {topic}"
no_game: "There's no 20 Questions game running in this channel."
stop_not_allowed: "Only the player who started the game or someone with Manage Server can stop it."
stop_done: "Game stopped."

# The opening: the rules, then a card with the starting hint (a short poem) and an optional photo,
# then the photo credit. The topic only appears in the thread name.
rules: |
  I'm a person, a thing, an event or an idea. Guess who I am!

  Ask me yes-or-no questions, take a guess, or ask for a hint if you're stuck. You only have {questions} questions, but hints are free.

  I'll react with {yes} for yes, {no} for no or {sort_of} for sort of, and add {close} when you're close.

  The game ends <t:{ends}:R> or whenever you say "stop the game".

  Ready to go?
hint_title: "Starting Hint"
riddle_line: "{line}"
photo_credit: "-# Photo by [{name}]({profile}) on [Unsplash]({home})"
warning: "⏳ This round ends <t:{ends}:R>."

# Answers to questions and guesses are reactions on the player's message.
reactions:
  yes: "✔️"
  no: "❌"
  sort_of: "🌀"
  close: "🔥" # added for near misses, and for "yes, but I'm something more specific"
questions_left: "{left} questions left."
last_question: "⚠️ That was the last question! The **next guess is final**, so talk it over first."
guess_now: "No more questions. Make your final guess!"
hint: "{hint}"

win: "🎉 **{username}** got it! You found the answer with {used} of {max} questions."
lose: "💥 That was your final guess. Better luck next time!"
timeout: "⏰ Time's up!"
stopped: "🛑 Game stopped."

# End-of-game card and stats
card_loading: "Pulling up the info card…"
reveal: "# {title}"
read_more: "Read more"
stats_title: "**Game stats**"
stat_most_questions: "🙋 Most questions asked: **{username}** ({count})"
stat_valuable: "💎 Most valuable question: **{username}**: {text}"
stat_closest: "🎯 Closest guess: **{username}**: {text}"
stat_farthest: "🛰️ Farthest guess: **{username}**: {text}"
stat_related: "🔗 Weirdly related guess: **{username}**: {text}"

# Instructions for the AI. The article is always given to it separately.
prompts:
  screen: |
    You screen topics for a family-friendly Discord party game where players guess a Wikipedia article with yes/no
    questions. Judge the article above on two things.
    - suitable: is it a suitable topic for players aged 13 and up, families and a party game? Unsuitable: sexual
      content, graphic violence or gore, recent tragedies, crimes or criminals as the main subject, hate, drugs,
      self-harm, or private individuals. History as it is taught in schools is fine even when it is dark (wars,
      empires, disasters, historical figures).
    - guessable: could an average English-speaking person with a K-12 education and general world knowledge guess it
      within about 10 yes/no answers? Guessable: South Dakota, 1776, Alexander Hamilton, Dentist, Ocean liner, Venice,
      Electric vehicle, Tesla Model X, Mars exploration. Not guessable: 2005 Sugar Bowl, a minor village, a
      little-known athlete, a single episode, match or bill.
  opening: |
    Write the opening of a game of 20 Questions about the article above.
    - poem: a haiku (three lines of 5, 7 and 5 syllables, separated by newlines) spoken by the subject in the
      first person, followed by "Who am I?" on its own line. Give a real hint about what it is, but never name it,
      never use words from its name, and avoid giveaways such as exact dates or unique places.
      Example for electromagnetism: "I pull and I push,\nbut only when charged with spark,\ninvisible hands.\nWho am I?"
    - topic: the broad theme it belongs to, 1 to 4 words, that doesn't give the answer away.
      Examples: "World War 2" for the T-34 tank, "Physics" for electromagnetism, "Amphibians" for Frog.
    - image_query: 2 to 4 words to search a stock photo site for an atmospheric photo of the broad topic. It must not
      find the answer or the kind of thing the answer is: for the T-34 tank, search "world war 2 soldiers", not
      "military vehicle"; for Frog, "pond at dawn", not "frog".
  photo: |
    We need a photo for the topic "{topic}" at the start of a family-friendly game of 20 Questions. The secret answer
    is the article above, and the players must not be able to work it out from the photo.
    Choose the best photo that: suits players aged 13 and up and families; clearly fits the topic; and does not show
    or name the secret answer or the kind of thing it is (no tank in the photo if the answer is a tank).
    Reply with its number, or 0 if none of them qualifies.
  interpret: |
    You are the game master of a co-op game of 20 Questions. The secret answer is the article above.
    Players can't see the article. Classify the newest player message and answer it.

    intent:
    - "question": a yes/no question about the secret ("Is it alive?", "Was it built in Europe?").
    - "guess": names a specific candidate for the secret ("Is it a frog?", "Titanic!", "the Eiffel Tower").
    - "hint": plainly asks for a hint or clue.
    - "stop": plainly asks to stop, end or quit the game.
    - "chat": anything else (players talking to each other, reactions, jokes). These get no reply.

    answer:
    - For a question: "yes", "no", "sort_of" (partly true, depends, or true in a loose sense) or
      "not_quite" (close to the truth but not exactly right). Answer truthfully from the article and common knowledge.
    - For a guess: "yes" if it is the secret, including misspellings, alternative names and translations
      ("Frogge" or "Frogg" for Frog). "not_quite" if it is closely related but not the same thing: a specific instance,
      a sibling, a narrower category, or something that has the secret in its name
      ("Pepe the Frog" for Frog, "Queen Mary 2" for Titanic). Otherwise "no".
    - For a question or guess that names a broader kind of thing the secret is ("Are you a tank?" when the secret is
      the Tiger I tank, "an animal" for Frog): "yes_more_specific".
    - For hint, stop and chat: "none".
    guess: for a guess, the candidate named, else "".
  verify: |
    A player in a game of 20 Questions guessed: "{guess}". The secret answer is the article above.
    Is the guess the same thing as the article's subject? Accept misspellings, alternative names, translations and
    common short forms. Answer "yes_more_specific" if the guess is a broader kind of thing the subject is,
    "not_quite" if it is closely related but a different thing, otherwise "no".
  hint: |
    You are the game master of a co-op game of 20 Questions. The secret answer is the article above.
    Below is everything the players have asked and guessed so far, and the hints already given.
    Write one new hint that helps them take the next step from what they already know: one short, plain, factual
    sentence in simple words, like "It's a college football game." or "It jumps very high for its size."
    It must not be a riddle: no wordplay, puns, metaphors, puzzles or cryptic descriptions, and only one fact at a time.
    Don't repeat what they've already worked out or what earlier hints said. Never name the secret or use words
    from its name. Reply with only the hint.
  wrap_up: |
    A game of 20 Questions about the article above has ended ({outcome}). The game log is below.
    1. infocard: a museum-style info card about the subject in Discord markdown: one plain sentence saying what it is,
       then 3 or 4 short facts, each on its own line starting with a bold category label. Use different categories
       that fit the subject, for example **Why it matters:**, **Fun fact:**, **History:**, **Science:**,
       **Culture:**, **By the numbers:** or **Did you know?** Keep each fact to one or two sentences.
       Don't repeat the title as a heading.
    2. Pick from the log (use "" for username and text when there's no good candidate):
       - most_valuable_question: the question that did most to narrow it down.
       - closest_guess: the wrong guess that came closest.
       - farthest_guess: the guess that was furthest off.
       - related_guess: a wrong guess that is weirdly related to the answer, such as an actor from the film
         when the answer is the film. Only pick one if it is genuinely related.
